name: ecommerce

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      laravel-web:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    networks:
      - app-network
    logging: *default-logging

  laravel:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in .env.production}/laravel:${IMAGE_TAG:?Set IMAGE_TAG in .env.production}
    build:
      context: .
      dockerfile: laravel/Dockerfile
      target: laravel-runtime
    restart: unless-stopped
    init: true
    env_file:
      - ./deploy/laravel.env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    expose:
      - "9000"
    healthcheck:
      test:
        - CMD-SHELL
        - "php -r '$$socket = @fsockopen(\"127.0.0.1\", 9000); exit($$socket ? 0 : 1);'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-network
    logging: *default-logging

  laravel-web:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in .env.production}/laravel-web:${IMAGE_TAG:?Set IMAGE_TAG in .env.production}
    build:
      context: .
      dockerfile: laravel/Dockerfile
      target: laravel-web
      args:
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-}
        VITE_REVERB_HOST: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
        VITE_REVERB_PORT: "443"
        VITE_REVERB_SCHEME: https
    restart: unless-stopped
    depends_on:
      laravel:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-network
    logging: *default-logging

  laravel-worker:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in .env.production}/laravel:${IMAGE_TAG:?Set IMAGE_TAG in .env.production}
    restart: unless-stopped
    init: true
    user: www-data
    env_file:
      - ./deploy/laravel.env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    command:
      - php
      - artisan
      - queue:work
      - rabbitmq
      - --queue=order-status,default
      - --sleep=1
      - --tries=3
      - --timeout=90
      - --no-interaction
    depends_on:
      laravel:
        condition: service_healthy
    networks:
      - app-network
    logging: *default-logging

  laravel-reverb:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in .env.production}/laravel:${IMAGE_TAG:?Set IMAGE_TAG in .env.production}
    restart: unless-stopped
    init: true
    user: www-data
    env_file:
      - ./deploy/laravel.env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
    command:
      - php
      - artisan
      - reverb:start
      - --host=0.0.0.0
      - --port=8080
      - --no-interaction
    depends_on:
      laravel:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - app-network
    logging: *default-logging

  fastapi:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in .env.production}/fastapi:${IMAGE_TAG:?Set IMAGE_TAG in .env.production}
    build:
      context: .
      dockerfile: fastapi/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ./deploy/fastapi.env.production
    environment:
      APP_ENV: production
      DEBUG: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: "8001"
    expose:
      - "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - app-network
    logging: *default-logging

networks:
  app-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
